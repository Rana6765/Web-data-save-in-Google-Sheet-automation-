<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - WebLoop</title>
  <style>
    body { background:#000; color:#fff; font-family:Arial; }
    .container { max-width:800px; margin:50px auto; background:#111; padding:30px; border-radius:10px; box-shadow:0 0 10px #ff6600; }
    h1 { color:#ff6600; text-align:center; }
    form { display:flex; flex-direction:column; gap:20px; }
    input,textarea { background:#000; border:1px solid #ff6600; border-radius:5px; padding:12px; color:#fff; }
    button { background:#ff6600; border:none; padding:12px; color:#fff; border-radius:5px; cursor:pointer; font-size:16px; }
    button:hover { background:#e25700; }
    .msg { text-align:center; margin-top:15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contact Us</h1>
    <form id="contactForm">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
      <button type="submit">Send Message</button>
      <div class="msg" id="status"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const statusMsg = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      try {
        const response = await fetch("contact.php", {
          method: "POST",
          body: formData
        });
        const text = await response.text();
        statusMsg.innerHTML = text;
        form.reset();
      } catch (error) {
        statusMsg.innerHTML = "<p style='color:red;'>Failed to send. Try again.</p>";
      }
    });
  </script>
</body>
</html>
